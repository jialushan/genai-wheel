name: Bimonthly GenAI wheel update

# Manual trigger only. Run from the Actions tab when needed.
on:
  workflow_dispatch:      # manual triggering from the Actions tab only
    inputs:
      verbose:
        description: "Show progress (uncheck for silent cron-style run)"
        type: boolean
        default: true

# Grant the workflow permission to commit files back to the repo,
# and to dispatch other workflows (so we can trigger deploy-pages
# after the auto-commit).
permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0



      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the v2 updater
        run: |
          # Manual runs default to verbose; scheduled runs are always quiet.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.verbose }}" = "true" ]; then
            python main.py
          else
            python main.py --quiet
          fi

      - name: Show what changed
        run: |
          echo "=== git diff summary ==="
          git diff --stat || true
          echo ""
          echo "=== Latest log file ==="
          ls -t logs/*.log 2>/dev/null | head -1 | xargs cat || true

      - name: Commit and push updates
        id: commit
        run: |
          git config user.name  "GenAI Wheel Bot"
          git config user.email "actions@github.com"
          # Add files one by one with `|| true` so missing optional files
          # (e.g. score_history.json when the updater timed out before
          # writing it) don't fail the whole step.
          git add data/tools.json       || true
          git add data/score_history.json || true
          git add index.html            || true
          git add logs/                 || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(date -u +"%Y-%m-%d")
            git commit -m "chore: bimonthly wheel update ($STAMP) [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        # The auto-commit above uses `[skip ci]` to avoid this workflow
        # re-triggering itself (which would cause an infinite loop). But that
        # also prevents the deploy-pages workflow from being auto-triggered
        # by the push. So we dispatch it explicitly here.
        if: steps.commit.outputs.pushed == 'true'
        run: |
          gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
