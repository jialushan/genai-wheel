name: Biweekly GenAI wheel update

# Runs every other Monday at 04:00 UTC (≈ 05:00 Geneva winter / 06:00 summer).
# Cron in GitHub Actions runs in UTC, and there's no "every 2 weeks" syntax
# natively — so we run weekly and skip odd-numbered weeks at the script level.
on:
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC
  workflow_dispatch:      # also allow manual triggering from the Actions tab
    inputs:
      verbose:
        description: "Show progress (uncheck for silent cron-style run)"
        type: boolean
        default: true

# Grant the workflow permission to commit files back to the repo,
# and to dispatch other workflows (so we can trigger deploy-pages
# after the auto-commit).
permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip if not a target ISO week (biweekly cadence)
        id: cadence
        run: |
          WEEK=$(date -u +%V)
          if [ $((10#$WEEK % 2)) -ne 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Week $WEEK is odd — skipping this run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Week $WEEK is even — proceeding."
          fi
        if: github.event_name == 'schedule'

      - name: Set up Python
        if: steps.cadence.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.cadence.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run the v2 updater
        if: steps.cadence.outputs.skip != 'true'
        run: |
          # Manual runs default to verbose; scheduled runs are always quiet.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.verbose }}" = "true" ]; then
            python main.py
          else
            python main.py --quiet
          fi

      - name: Show what changed
        if: steps.cadence.outputs.skip != 'true'
        run: |
          echo "=== git diff summary ==="
          git diff --stat || true
          echo ""
          echo "=== Latest log file ==="
          ls -t logs/*.log 2>/dev/null | head -1 | xargs cat || true

      - name: Commit and push updates
        if: steps.cadence.outputs.skip != 'true'
        id: commit
        run: |
          git config user.name  "GenAI Wheel Bot"
          git config user.email "actions@github.com"
          # Add files one by one with `|| true` so missing optional files
          # (e.g. score_history.json when the updater timed out before
          # writing it) don't fail the whole step.
          git add data/tools.json       || true
          git add data/score_history.json || true
          git add index.html            || true
          git add logs/                 || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            STAMP=$(date -u +"%Y-%m-%d")
            git commit -m "chore: biweekly wheel update ($STAMP) [skip ci]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        # The auto-commit above uses `[skip ci]` to avoid this workflow
        # re-triggering itself (which would cause an infinite loop). But that
        # also prevents the deploy-pages workflow from being auto-triggered
        # by the push. So we dispatch it explicitly here.
        if: steps.cadence.outputs.skip != 'true' && steps.commit.outputs.pushed == 'true'
        run: |
          gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
